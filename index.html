<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1.Quiz-Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Start Screen -->
    <div class="container" id="start-screen">

      <div class="screen">
        <h1>Quiz Time!</h1>
        <p>Test your knowledge with these fun questions</p>
        <button>start Quiz</button>
      </div>




      <!-- Quiz Screen -->
      <div class="screen active" id="quiz-screen">

        <div class="quiz-header">
          <h2 id="question-text">Question goes here</h2>
          <div id="quiz-info">
            <p>
              Question <span id="current-question">1</span> of <span>5</span>
            </p>
            <p>Score: <span id="score">0</span></p>
          </div>
        </div>

        



        <div class="answers-container" id="answers-container">
          <!-- Answer buttons will be inserted here -->
        </div>



        <div class="progress-bar">
          <div class="progress" id="progress"></div>
        </div>
      </div>




      <!-- Result Screen -->
      <div class="result-screen" id="screen">
        <div class="screen">
          <h1>Quiz Results</h1>
          <div class="result-info">
            <p>
              You scored <span id="final-score">0</span> out of
              <span id="max-score">5</span>
            </p>
            <div id="result-message">Good Job!</div>
          </div>
          <button id="restart-btn">Restart Quiz</button>
        </div>
      </div>



    </div>
  </body>
</html>
